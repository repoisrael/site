name: StemRip Local Docker Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "stemrip-local/**"
      - ".github/workflows/stemrip-local-docker.yml"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: stemrip-local
        run: docker build -t stemrip-local:ci .
